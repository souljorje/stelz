name: Setup Stelz
description: Install the pinned Node, Bun, npm, and workspace dependencies without lifecycle scripts.
inputs:
  registry-url:
    description: Optional npm registry for trusted publication.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        registry-url: ${{ inputs.registry-url }}
        package-manager-cache: false
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - run: npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
      shell: bash
    - run: bun install --frozen-lockfile --ignore-scripts
      shell: bash
      env:
        CAMOFOX_SKIP_DOWNLOAD: "1"
