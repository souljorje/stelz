name: Setup Stelz
description: Install the pinned Node, Bun, npm, and workspace dependencies without lifecycle scripts.
inputs:
  registry-url:
    description: Optional npm registry for trusted publication.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        registry-url: ${{ inputs.registry-url }}
        package-manager-cache: false
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - run: npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
      shell: bash
    # Publication installs without the cache, so a cached package cannot reach the publish credentials.
    - if: inputs.registry-url == ''
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - run: bun install --frozen-lockfile --ignore-scripts
      shell: bash
