name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-package:
        description: Skip the packed-archive checks when the caller runs its own.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Temporarily disabled while GitHub macOS runners have capacity issues.
          # - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check affected tests on pull requests
        if: github.event_name == 'pull_request'
        env:
          STELZ_TEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: bun run check:changed
      - name: Check all tests on main, manual, and release runs
        if: github.event_name != 'pull_request'
        run: bun run check

  package:
    name: Packed archive (${{ matrix.os }})
    if: ${{ !inputs.skip-package }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Temporarily disabled while GitHub macOS runners have capacity issues.
          # - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run pack
      - run: bun run test:install
      - run: bun run test:install --native
