name: Publish verified npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version with completed browser acceptance and a matching vVERSION tag
        required: true
        type: string
      candidate_run_id:
        description: Successful Prepare release candidate run
        required: true
        type: string
      sha256:
        description: SHA-256 of the tested tarball
        required: true
        type: string
      dist_tag:
        description: npm distribution tag
        required: true
        type: choice
        default: latest
        options: [latest, next]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'souljorje/stelz'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CAMOFOX_SKIP_DOWNLOAD: "1"
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
      RELEASE_SHA256: ${{ inputs.sha256 }}
      RELEASE_DIST_TAG: ${{ inputs.dist_tag }}
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stelz-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: release-artifacts
      - run: bun scripts/check-publication.ts --archive release-artifacts/*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun run verify:release --archive release-artifacts/*.tgz
      - run: npm publish ./release-artifacts/*.tgz --ignore-scripts --access public --tag "$RELEASE_DIST_TAG"
