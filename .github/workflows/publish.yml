name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'souljorje/stelz' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip-package: true

  plan:
    if: github.repository == 'souljorje/stelz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      artifact_id: ${{ steps.plan.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: plan
        uses: changesets/action/select-mode@v2.1.2
      - name: Skip versions already uploaded
        id: mode
        env:
          RELEASE_MODE: ${{ steps.plan.outputs.mode }}
        run: |
          release_mode="$RELEASE_MODE"
          release_version=$(bun -p 'require("./package.json").version')
          if [[ "$release_mode" == publish ]] && git show-ref --verify --quiet "refs/tags/v$release_version"; then
            release_mode=none
          fi
          printf 'mode=%s\n' "$release_mode" >> "$GITHUB_OUTPUT"

  version:
    needs: [plan, checks]
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: version
        uses: changesets/action/version@v2.1.2
        with:
          script: bun run version:packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
      - name: Check the version PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName > "$RUNNER_TEMP/release-pr-branch"
          gh workflow run ci.yml --ref "$(cat "$RUNNER_TEMP/release-pr-branch")"

  pack:
    needs: [plan, checks]
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          merge-multiple: true
          path: .state/publish-plan
      - run: bun run pack --publish-plan .state/publish-plan/publish-plan.json
      - uses: actions/upload-artifact@v7
        id: archive
        with:
          name: stelz-package
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  installation:
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Temporarily disabled while GitHub macOS runners have capacity issues.
          # - macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact_id }}
          merge-multiple: true
          path: release-artifacts
      - run: bun run test:install --archive release-artifacts/packages/*.tgz
      - run: bun run test:install --archive release-artifacts/packages/*.tgz --native

  publish:
    needs: [pack, installation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact_id }}
          merge-multiple: true
          path: release-artifacts
      - run: sha256sum --check *.sha256
        working-directory: release-artifacts/packages
      - name: Publish, tag, and create the GitHub release
        uses: changesets/action/publish@v2.1.2
        with:
          script: bun run release
      - name: Attach package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun -p '"v" + require("./package.json").version' > "$RUNNER_TEMP/release-tag"
          gh release upload "$(cat "$RUNNER_TEMP/release-tag")" release-artifacts/packages/*.tgz release-artifacts/packages/*.sha256 --clobber
