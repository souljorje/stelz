name: Prepare bundled Camofox change
on:
  push:
    branches: [build/prepare-camofox-bundle]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'souljorje/stelz'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAMOFOX_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/prepare-bundled-camofox.ts
      - name: Commit only the prepared change
        run: |
          rm scripts/prepare-bundled-camofox.ts scripts/.bundle-verifier-template.txt scripts/.patch-doc-template.txt .github/workflows/prepare-camofox-bundle.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: bundle prepared Camofox dependencies'
          git push origin HEAD:refs/heads/build/prepare-camofox-bundle
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run verify:release
