name: Validate bundled Camofox release
on:
  push:
    branches: [build/prepare-camofox-bundle]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAMOFOX_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run verify:release
      - name: Node regression tests
        if: ${{ !cancelled() }}
        run: bun run test:regression
      - name: Setup regression tests
        if: ${{ !cancelled() }}
        run: bun test tests/integration/setup.test.ts
