# Local checks. Install once per clone with `bunx lefthook install`. See CONTRIBUTING.md.
# CI runs `bun run check` and remains the authority.
no_auto_install: true
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: ["**/*.{ts,tsx}", "package.json", ".oxlintrc.json"]
      run: bun run lint
    - name: typecheck
      glob: ["**/*.{ts,tsx}", "{tsconfig,package}.json"]
      run: bun run typecheck
    - name: affected tests
      run: bun run test:changed

pre-push:
  jobs:
    - name: check
      env:
        STELZ_TEST_BASE: origin/main
      run: bun run check:changed
