# Local checks. Install once per clone with `bunx lefthook install`. See CONTRIBUTING.md.
# CI runs `bun run check` and remains the authority.
no_auto_install: true
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: typecheck
      glob: ["**/*.{ts,tsx}", "{tsconfig,package}.json"]
      run: bun run typecheck
    - name: regression
      glob: "{src,tests/regression,tests/helpers}/**"
      run: bun run test:regression
    # Import-graph selection. It misses code that tests reach only through a CLI
    # subprocess, so pre-push runs the full suite.
    - name: affected tests
      glob: ["**/*.{ts,tsx}", "package.json"]
      run: bun test --parallel --changed=HEAD ./tests/unit ./tests/integration

pre-push:
  jobs:
    - name: check
      run: bun run check

# Select changed files here. The runner shares a browser when integration and typing both run.
# BASE=HEAD~1 selects another base. --file PATH selects one path. --all-files selects all paths.
# STELZ_DRY_RUN=echo prints the selected commands without starting a browser.
browser:
  files: >-
    base=$(git merge-base "${BASE:-origin/main}" HEAD) &&
    git diff --name-only "$base" &&
    git ls-files --others --exclude-standard
  jobs:
    - name: browser suites
      run: bun scripts/browser-tests.ts {files}
